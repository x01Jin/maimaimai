<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>MaiMaiMai</title>
    <!-- Friendly rounded typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "selector",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Quicksand", "sans-serif"],
            },
            colors: {
              dreamy: {
                pink: "#FF8C94",
                blue: "#67B6F5",
                purple: "#9F86FF",
                yellow: "#FFE66D",
                green: "#4ECDC4",
                dark: "#2D3436",
                slate: "#636E72",
              },
              midnight: {
                bg: "#0f172a",
                card: "rgba(30, 41, 59, 0.7)",
                text: "#f1f5f9",
                pink: "#f472b6",
                blue: "#60a5fa",
                purple: "#a78bfa",
                yellow: "#fbbf24",
                green: "#34d399",
                slate: "#94a3b8",
              },
            },
            borderRadius: {
              "4xl": "2.5rem",
              "5xl": "3.5rem",
            },
          },
        },
      };
    </script>
    <script>
      // Apply theme as early as possible to avoid flash
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;
        /* IE and Edge */
        scrollbar-width: none;
        /* Firefox */
      }

      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #9f86ff;
      }

      body {
        /* Rich Prism gradient background */
        background: linear-gradient(
          160deg,
          #9f86ff 0%,
          #67b6f5 25%,
          #b2f2e3 50%,
          #ffd3e0 75%,
          #ff8c94 100%
        );
        background-size: 200% 200%;
        animation: prismShift 20s ease infinite;
        background-attachment: fixed;
        min-height: 100%;
        min-height: 100dvh;
        color: #2d3436; /* Darker, high contrast text */
        font-family: "Quicksand", sans-serif;
        overflow: hidden; /* Prevent body scrolling entirely */
      }

      .dark body {
        background: linear-gradient(
          160deg,
          #0f172a 0%,
          #1e1b4b 25%,
          #312e81 50%,
          #1e1b4b 75%,
          #0f172a 100%
        );
        color: #f1f5f9;
      }

      @keyframes prismShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Glassmorphism utility with better contrast */
      .glass-card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 16px rgba(159, 134, 255, 0.1);
        will-change: transform, opacity;
      }

      .dark .glass-card {
        background: rgba(30, 41, 59, 0.7);
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      /* Mobile Performance & Layout Optimization */
      @media (max-width: 768px) {
        .glass-card,
        .backdrop-blur-3xl,
        .backdrop-blur-xl,
        .backdrop-blur-md,
        .blur-2xl,
        .blur-xl,
        .blur-lg {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          filter: none !important;
        }
      }

      /* Touch action optimization */
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* Force 3D for the main background wrapper if needed */
      #root {
        transform: translateZ(0);
        height: 100%;
        width: 100%;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react-dom": "https://esm.sh/react-dom@^19.2.3?deps=react@^19.2.3",
          "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client?deps=react@^19.2.3",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0?deps=react@^19.2.3",
          "peerjs": "https://esm.sh/peerjs@^1.5.5",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "framer-motion": "https://esm.sh/framer-motion@11.0.3?deps=react@^19.2.3"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
